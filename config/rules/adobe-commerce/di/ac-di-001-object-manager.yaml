schema_version: "1.0"
id: "AC_DI_001"
name: "ac-di-001-object-manager"
title: "Direct ObjectManager Usage Prohibited"
description: >
  Direct usage of ObjectManager::getInstance() in custom code bypasses the Magento 2
  dependency injection framework, creates tight coupling, and prevents proper unit testing.
  The only acceptable uses are in bootstrapping code, factories, and proxies generated by
  the Magento DI compiler.
category: "dependency_injection"
severity: "critical"
tier: 1
roles:
  - developer
  - tech_lead
  - ci
platforms:
  - cli
  - ci
  - sarif
  - junit
introduced_in: "1.0.0"
tags:
  - di
  - magento2
  - coupling
globs:
  - "**/*.php"
  - "app/code/**/*.php"
check:
  type: regex
  pattern: 'ObjectManager::getInstance\s*\('
recommendation: >
  Declare the dependency as a constructor parameter typed with the appropriate interface.
  Run `bin/magento setup:di:compile` to regenerate factories and proxies.
examples:
  bad: |
    $objectManager = \Magento\Framework\App\ObjectManager::getInstance();
    $model = $objectManager->create(\Vendor\Module\Model\Example::class);
  good: |
    public function __construct(
        private readonly \Vendor\Module\Model\ExampleFactory $exampleFactory
    ) {}
    // Then use: $this->exampleFactory->create()
references:
  - "https://developer.adobe.com/commerce/php/development/components/dependency-injection/"
  - "https://developer.adobe.com/commerce/php/best-practices/extensions/"
