schema_version: "1.0"
id: "AC_HTTP_002"
name: "ac-http-002-curl-error-check"
title: "cURL Execute Without Error Handling"
description: >
  Calling curl_exec() and assigning the result to a variable without checking for
  errors means network failures, DNS errors, and HTTP errors are silently swallowed.
  The application may then pass null or false to downstream processing, causing
  confusing failures far from the actual error site. Always check curl_errno() and
  curl_error() after execution.
category: "http"
severity: "error"
tier: 1
roles:
  - developer
  - tech_lead
  - ci
platforms:
  - cli
  - ci
  - sarif
  - junit
introduced_in: "3.0.0"
source: "adobe-commerce-http.mdc"
tags:
  - http
  - curl
  - error-handling
  - reliability
globs:
  - "**/*.php"
  - "app/code/**/*.php"
check:
  type: regex
  pattern: '\$\w+\s*=\s*curl_exec\s*\('
recommendation: >
  Always check for errors after curl_exec():
  $response = curl_exec($ch);
  if ($response === false) {
      $error = curl_error($ch);
      curl_close($ch);
      throw new \RuntimeException("HTTP request failed: {$error}");
  }
  $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
examples:
  bad: |
    $ch       = curl_init($url);
    $response = curl_exec($ch);
    $data     = json_decode($response, true);
    curl_close($ch);
  good: |
    $ch = curl_init($url);
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
    curl_setopt($ch, CURLOPT_TIMEOUT, 30);
    $response = curl_exec($ch);
    if ($response === false) {
        throw new \RuntimeException('Request failed: ' . curl_error($ch));
    }
    $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
    curl_close($ch);
    $data = json_decode($response, true);
references:
  - "https://www.php.net/manual/en/function.curl-errno.php"
  - "https://developer.adobe.com/commerce/php/development/security/"
