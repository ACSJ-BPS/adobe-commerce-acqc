schema_version: "1.0"
id: "AC_SEC_004"
name: "ac-sec-004-hardcoded-credentials"
title: "Hardcoded Credentials Detected"
description: >
  Hardcoded passwords, API keys, or secrets found in source code. This is a critical security
  vulnerability that exposes sensitive credentials in version control and log files. Credentials
  hardcoded in code cannot be rotated without a code deployment.
category: "security"
severity: "blocker"
tier: 1
roles:
  - developer
  - tech_lead
  - architect
  - ci
platforms:
  - cli
  - ci
  - sarif
  - junit
introduced_in: "1.0.0"
tags:
  - security
  - credentials
  - secrets
  - owasp-a02
globs:
  - "**/*.php"
  - "**/*.xml"
  - "**/*.env"
check:
  type: regex
  pattern: '(?i)(password|api_key|api_secret|secret_key|access_token|auth_token)\s*=\s*[''"][^''"\s]{3,}[''"]'
recommendation: >
  Store credentials in environment variables or Adobe Commerce's encrypted configuration
  (bin/magento config:set --lock-env). Never hardcode sensitive values in source files.
examples:
  bad: |
    $config = [
        'password' => 'mysecret123',
        'api_key'  => 'sk_live_abc123xyz',
    ];
  good: |
    $config = [
        'password' => $this->encryptedConfig->getValue('payment/gateway/password'),
        'api_key'  => $_ENV['PAYMENT_API_KEY'],
    ];
references:
  - "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"
  - "https://developer.adobe.com/commerce/php/development/cache/partial/database-caching/"
