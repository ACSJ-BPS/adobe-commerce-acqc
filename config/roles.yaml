# Global configuration for role-based analysis
global:
  default_role: "senior-developer"
  enable_role_switching: true
  role_specific_rules: true
  adaptive_thresholds: true
  
  reporting:
    include_role_metrics: true
    show_role_progression: true
    generate_role_reports: true
    
  integration:
    ci_cd_role_checks: true
    pr_role_validation: true
    automated_role_assessment: true 