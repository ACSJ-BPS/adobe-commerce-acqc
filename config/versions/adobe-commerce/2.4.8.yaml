    column: "tax_before_discount"
    change_type: column_dropped
    migration_risk: high
    data_migration_required: false
    estimated_duration_minutes: 5
  - table: "catalog_product_entity"
    change_type: index_added
    index_name: "UNQ_CATALOG_PRODUCT_ENTITY_SKU"
    index_type: unique
    migration_risk: high
    estimated_duration_minutes: 60
  - table: "customer_address_entity"
    column: "inline"
    change_type: column_added
    migration_risk: low
    data_migration_required: false
    estimated_duration_minutes: 1
  - table: "sales_order"
    column: "order_currency_code"
    change_type: column_type_changed
    migration_risk: medium
    data_migration_required: false
    estimated_duration_minutes: 45
  - table: "catalog_category_product_index"
    change_type: index_added
    index_name: "IDX_CCPI_CATEGORY_ID_PRODUCT_ID"
    index_type: index
    migration_risk: critical
    estimated_duration_minutes: 240
  - table: "quote"
    column: "subtotal_with_discount"
    change_type: column_type_changed
    migration_risk: low
    data_migration_required: false
    estimated_duration_minutes: 3
  - table: "product_alert_stock"
    column: "website_id"
    change_type: column_added
    migration_risk: low
    data_migration_required: false
    estimated_duration_minutes: 2
  - table: "catalog_product_entity_varchar"
    change_type: index_added
    index_name: "IDX_CPEV_ENTITY_ID_ATTRIBUTE_ID_STORE_ID"
    index_type: index
    migration_risk: critical
    estimated_duration_minutes: 180

security_advisories:
  - id: "APSB25-001"
    cve: "CVE-2025-00001"
    severity: critical
    description: "Remote code execution via crafted request to checkout API"
    affected_versions: ["2.4.6", "2.4.7", "2.4.7-p1", "2.4.7-p2"]
    fixed_in: "2.4.8"
    patch_available: true
    patch_url: "https://experienceleague.adobe.com/docs/commerce-operations/release/notes/security-patches/2-4-8-patches.html"
  - id: "APSB25-002"
    cve: "CVE-2025-00002"
    severity: high
    description: "Stored XSS in product attribute configuration admin page"
    affected_versions: ["2.4.6", "2.4.6-p1", "2.4.6-p2", "2.4.7", "2.4.7-p1", "2.4.7-p2", "2.4.7-p3"]
    fixed_in: "2.4.8"
    patch_available: true
    patch_url: "https://experienceleague.adobe.com/docs/commerce-operations/release/notes/security-patches/2-4-8-patches.html"
