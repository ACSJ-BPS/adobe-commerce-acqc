# Predictive Analytics Configuration for ACQC (Adobe Commerce Quality Control)
# Configure forecasting models, risk assessment, and data collection

predictive_analytics:
  # Global settings
  enabled: true
  data_directory: "var/metrics"
  cache_ttl: 3600  # 1 hour
  
  # Statistical models configuration
  models:
    quality_trend:
      enabled: true
      lookback_days: 90
      forecast_days: 30
      confidence_threshold: 0.7
      models:
        - linear_regression
        - exponential_smoothing
        - seasonal_decomposition
      
    technical_debt:
      enabled: true
      prediction_days: 30
      velocity_calculation: "linear_regression"
      debt_threshold_hours: 100
      risk_categories:
        - security
        - performance
        - maintainability
        - logic
      
    risk_scoring:
      enabled: true
      sensitivity: 0.8
      categories:
        security:
          weight: 0.25
          critical_threshold: 0.8
        performance:
          weight: 0.20
          critical_threshold: 0.7
        maintainability:
          weight: 0.20
          critical_threshold: 0.6
        reliability:
          weight: 0.15
          critical_threshold: 0.7
        operational:
          weight: 0.10
          critical_threshold: 0.8
        technical_debt:
          weight: 0.10
          critical_threshold: 0.6
      
    performance_forecast:
      enabled: true
      horizon_days: 60
      degradation_threshold: 0.15
      alert_thresholds:
        critical: 0.8
        warning: 0.6
        info: 0.4

  # Data collection configuration
  data_collection:
    interval_hours: 1
    retention_days: 365
    metrics:
      quality_score: true
      complexity_metrics: true
      technical_debt: true
      violation_metrics: true
      performance_metrics: true
      maintainability_index: true
      test_coverage: true
      code_size: true
      team_metrics: true
      dependency_metrics: true
    
    # External integrations
    integrations:
      git:
        enabled: true
        commit_analysis: true
        author_tracking: true
      
      testing:
        enabled: true
        coverage_tracking: true
        test_result_analysis: true
      
      ci_cd:
        enabled: true
        build_metrics: true
        deployment_frequency: true

  # AI integration
  ai_features:
    trend_insights: true
    debt_prediction_insights: true
    risk_assessment_insights: true
    recommendation_generation: true
    anomaly_explanation: true
    
    # AI prompts configuration
    prompts:
      predictive_insights: |
        Analyze the following predictive analytics data and provide insights:
        
        Trend Analysis: {{trend_analysis}}
        Debt Prediction: {{debt_prediction}}
        Risk Assessment: {{risk_assessment}}
        
        Provide actionable insights in JSON format:
        {
          "key_insights": ["insight1", "insight2"],
          "recommendations": ["rec1", "rec2"],
          "risk_factors": ["factor1", "factor2"],
          "improvement_opportunities": ["opp1", "opp2"]
        }
      
      debt_prediction_insights: |
        Analyze technical debt prediction and provide insights:
        
        Debt Forecast: {{debt_forecast}}
        Debt Drivers: {{debt_drivers}}
        
        Focus on:
        1. Main drivers of debt accumulation
        2. Risk mitigation strategies
        3. Optimal refactoring timing
        4. Impact on development velocity
        
        Provide structured analysis with recommendations.
      
      risk_assessment_insights: |
        Analyze project risks and provide strategic insights:
        
        Risk Scores: {{risk_scores}}
        Critical Risks: {{critical_risks}}
        Risk Trends: {{risk_trends}}
        
        Provide:
        1. Priority ranking of risks
        2. Mitigation strategies
        3. Timeline recommendations
        4. Resource allocation advice

  # Alerting and notifications
  alerts:
    enabled: true
    channels:
      - email
      - slack
      - webhook
    
    thresholds:
      quality_decline:
        trigger: "quality_score_decrease > 0.2"
        severity: "warning"
        frequency: "daily"
      
      debt_acceleration:
        trigger: "debt_velocity > 50"  # 50 minutes per day
        severity: "critical"
        frequency: "immediate"
      
      risk_escalation:
        trigger: "overall_risk > 0.8"
        severity: "critical"
        frequency: "immediate"
      
      performance_degradation:
        trigger: "performance_trend == 'declining'"
        severity: "warning"
        frequency: "weekly"

  # Reporting configuration
  reports:
    enabled: true
    schedule: "weekly"
    formats:
      - json
      - html
      - pdf
    
    include:
      executive_summary: true
      trend_analysis: true
      risk_assessment: true
      technical_debt_forecast: true
      team_productivity: true
      recommendations: true
      
    distribution:
      - email: "team-leads@company.com"
      - slack: "#quality-reports"
      - dashboard: true

  # Dashboard configuration
  dashboard:
    enabled: true
    refresh_interval: 300  # 5 minutes
    charts:
      - quality_trend_chart
      - debt_accumulation_chart
      - risk_heatmap
      - performance_metrics
      - team_productivity
      - anomaly_timeline
    
    widgets:
      - quality_score_gauge
      - debt_velocity_meter
      - risk_score_indicator
      - critical_alerts_list
      - recommendations_panel

# Integration with existing ACQC configuration
analyzers:
  predictive_analytics:
    enabled: true
    auto_collect_metrics: true
    generate_forecasts: true
    assess_risks: true
    ai_insights: true 