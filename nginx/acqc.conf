# ACQC — native nginx config for local development
# Place this file in /etc/nginx/sites-available/acqc.conf
# and symlink: ln -s /etc/nginx/sites-available/acqc.conf /etc/nginx/sites-enabled/acqc.conf
#
# Prerequisites:
#   - PHP 8.3-FPM running on unix socket (adjust fastcgi_pass if using TCP 127.0.0.1:9000)
#   - MySQL 8.0 running on 127.0.0.1:3306
#   - Redis 7 running on 127.0.0.1:6379
#   - React app built: cd <project-root> && npm run build  (outputs to dist/)
#   - Laravel storage linked: cd server && php artisan storage:link

server {
    listen 80;
    server_name localhost acqc.local;

    # ─── React SPA (served from dist/) ──────────────────────────────────────
    root /path/to/m2-quality/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Laravel API (proxied to php-fpm) ───────────────────────────────────
    location /api {
        alias /path/to/m2-quality/server/public;
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /path/to/m2-quality/server/public/index.php;
            include fastcgi_params;
        }
    }

    # ─── Laravel storage (public disk) ──────────────────────────────────────
    location /storage {
        alias /path/to/m2-quality/server/storage/app/public;
    }

    # ─── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ─── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── Static asset caching ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_log  /var/log/nginx/acqc_error.log;
    access_log /var/log/nginx/acqc_access.log;
}
