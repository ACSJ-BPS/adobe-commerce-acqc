# =============================================================================
# ACQC built-in scoring configuration
# =============================================================================
#
# This file controls EVERY score, verdict and status cell that ACQC prints:
#   - `report` HTML: Overall ring, the dimension rings, the READY / RISKY / BLOCKED
#     pill, CI/CD gate card, ring colours, "below enterprise threshold" risk card.
#   - `report` Excel: Summary sheet, Executive KPI scorecard, Release Readiness
#     text, Overall Assessment, Business Impact, Security / Performance /
#     Code Quality / Module sheet status cells.
#   - `report` JSON, PDF, SARIF, JUnit: `scores.*` values and quality gates.
#   - `audit`: score, grade (A+..F), console label.
#
# HOW TO OVERRIDE PER PROJECT
# ---------------------------
# Do not edit this file for one project. Put a `scoring:` section in
# `<project>/.acqc/project.yaml`. ACQC finds the nearest `.acqc/project.yaml`
# by walking up from the scanned folder (e.g. `app/code`) to the git root.
# If the scanned folder is not inside a git repository, only
# `<scanned folder>/.acqc/project.yaml` is used (no search above it).
# The report prints "Scoring config: config/scoring.yaml + <path>" so you can
# see which file was used.
#
# Merge rules (project file over this file):
#   - Maps (e.g. `bands`, `overall.weights`, `dimensions.<id>`, `kpis.<id>`)
#     merge key by key: you only write the keys you want to change.
#   - Lists REPLACE the built-in list completely: `readiness`, `caps`,
#     `grades`, `tiers`, `gates`, `assessment`, `categories`, `rule_ids`,
#     `terms`. Copy the whole list if you only want to change one entry.
#   - Setting a key to `null` removes it (e.g. `kpis: { business_risk: null }`
#     removes that Excel KPI row).
#
# Every value is validated at start-up. A typo (unknown input name, bad
# operator, unknown normalize mode) stops the run with the exact config path,
# e.g. "Unknown scoring condition input "erorr" at scoring.readiness[1].when_any".
#
# CONDITIONS
# ----------
# Several sections use conditions written as   <input>: "<op> <number>"
#   op = >  >=  <  <=  ==  !=          example:  error: "> 50"
# No other syntax (no AND/OR inside the string, no formulas).
#
# Inputs you can use in conditions and KPI terms:
#   Severity counts (raw, every finding counts 1):
#     blocker, critical, error, warning, info, minor, total
#   Weighted counts (each finding counts its `category_weights` value):
#     blocker_weighted, error_weighted, ..., total_weighted
#   Share of all findings in percent (0-100, based on weighted counts):
#     blocker_pct, critical_pct, error_pct, warning_pct, info_pct, minor_pct
#   Per file / per 1,000 lines (weighted):
#     error_per_file, error_per_kloc, ... (same pattern for every severity)
#   Category counts (raw), plus the same suffixes:
#     security, performance, maintainability, deprecation, api, logic,
#     documentation, frontend, seo, accessibility, and any category that
#     appears in the scan or in the lists below;
#     e.g. security_pct, seo_weighted, performance_per_file
#     Note: `deprecation` also counts findings mapped to the Compliance ring
#     by `rule_ids` (e.g. deprecation rules that are tagged `logic`).
#   Dimension rings: <ring id>_score (e.g. reliability_score), and the raw
#     ring finding count under the ring id when it differs from a category
#     name (e.g. api_quality, code_quality, reliability).
#   Other: overall (final Overall score), debt_hours, files, kloc,
#     maintainability_index.
#
# Rule of thumb: readiness / caps / gates should use RAW counts (`error`) when
# you mean "real number of findings", and `_weighted` counts when noisy
# categories (seo, accessibility) should count less.
# =============================================================================

scoring:

  # ---------------------------------------------------------------------------
  # severity_aliases
  # Maps severity names produced by some analyzers to the 6 ACQC severities
  # (blocker, critical, error, warning, info, minor). Any other unknown
  # severity is scored as `info`.
  # ---------------------------------------------------------------------------
  severity_aliases:
    high: critical
    medium: warning
    low: info

  # ---------------------------------------------------------------------------
  # category_weights
  # How much ONE finding of a category counts in SCORES (Overall, dimension
  # rings, Excel KPI densities). Default for any category not listed: 1.0.
  #   1.0  = full weight, 0.25 = a quarter, 0 = ignored in scores.
  # The findings are still listed in the report. Readiness, caps and gates use
  # raw counts unless you use the `_weighted` inputs. Debt hours ignore these
  # weights unless `debt.apply_category_weights: true`.
  # To remove a category from the report entirely, use
  # `report: { exclude_categories: [seo, accessibility] }` in .acqc/project.yaml.
  # ---------------------------------------------------------------------------
  category_weights:
    seo: 0.25
    accessibility: 0.25

  # ---------------------------------------------------------------------------
  # bands
  # Colour thresholds for every ring and the "below enterprise threshold"
  # risk card in HTML:
  #   score >= healthy               -> green  (Healthy)
  #   attention <= score < healthy   -> amber  (Needs attention)
  #   score < attention              -> red    (At risk)
  # ---------------------------------------------------------------------------
  bands:
    healthy: 80
    attention: 60

  # ---------------------------------------------------------------------------
  # overall  (report Overall score, HTML Overall ring, Excel Quality Score)
  #
  #   score = 100 - SUM( normalized(weighted count of severity) x weight )
  #   then clamped to [floor, 100], rounded to 1 decimal, then `caps` applied.
  #   Zero findings always scores 100.
  #   Default: severity-weighted findings per 1,000 scanned lines, including
  #   comments and blank lines (not executable-only lines).
  #
  # normalize: how a severity count is turned into a number before weighting
  #   absolute       count / per          (default; per = 1000 means
  #                                        "points lost per 1,000 findings")
  #   per_file       count / files analyzed
  #   per_kloc       count / (lines of code / 1000)
  #   share_of_total count / all findings x 100   (percent of findings)
  # per:     divisor used only by `absolute` (ignored when <= 1).
  # weights: points lost per normalized unit, per severity. Missing = 0.
  # floor:   lowest possible score.
  # caps:    list of upper limits. Each cap: { when: {<conditions>}, max_score: N }.
  #          A cap applies when ANY of its conditions is true; if several caps
  #          apply the lowest max_score wins. The HTML shows "Capped at N (...)".
  #          Example: - { when: { blocker: ">= 1" }, max_score: 40 }
  # ---------------------------------------------------------------------------
  overall:
    normalize: per_kloc
    per: 1000
    weights:
      blocker: 15.0
      critical: 6.0
      error: 2.5
      warning: 0.6
      info: 0.1
      minor: 0.03
    floor: 0
    caps: []

  # ---------------------------------------------------------------------------
  # dimensions  (HTML rings after "Overall", in this order; JSON scores.dimensions)
  #
  # Each key is a ring id. Remove a ring with `<id>: null` in the project file;
  # add a ring by adding a new id (e.g. an `accessibility` ring).
  #
  # Which findings feed a ring:
  #   1. `rule_ids` globs (fnmatch, case-insensitive) are checked first, across
  #      all rings, in ring order.
  #   2. Then `categories` (exact category names, lower case), in ring order.
  #   A finding feeds at most ONE ring (first match). Findings that match no
  #   ring still count in Overall and are listed in JSON
  #   `scores.unmapped_categories` so gaps are visible.
  #
  # Ring formula:
  #   Category / rule ring:
  #     count   = weighted findings mapped to this ring
  #               + floor(weighted count of each listed `severities` x factor)
  #                 (severity extras count findings of ALL categories)
  #     score   = 100 - normalized(count) x mult
  #   Severity-only ring (no categories / rule_ids, only `severities`):
  #     score   = 100 - SUM( normalized(weighted severity count) x weight ) x mult
  #   Result is rounded and clamped to [floor, 100]. Zero findings = 100.
  #
  # Keys:
  #   label / subtitle  text under the ring
  #   normalize         absolute | per_file | per_kloc | share_of_total (see `overall`)
  #                     share_of_total = "what % of all findings belong to this
  #                     ring"; removing noise (e.g. seo) raises the share, so the
  #                     ring can DROP when noise is removed. Use per_file or
  #                     per_kloc if you want rings that do not depend on noise.
  #   per               divisor for `absolute` (default 1 = raw count)
  #   mult              points lost per normalized unit
  #   floor             lowest possible ring score
  #   categories        list of finding categories for this ring
  #   rule_ids          list of rule id globs for this ring (win over categories)
  #   severities        severity -> weight/factor map (see formula above)
  #   caps              optional, same format as overall.caps
  # ---------------------------------------------------------------------------
  dimensions:
    # Errors and bugs: share of blocker / critical / error findings.
    reliability:
      label: Reliability
      subtitle: Errors/Bugs
      normalize: share_of_total
      floor: 0
      mult: 1.0
      severities:
        blocker: 15.0
        critical: 8.0
        error: 2.0

    # Security: absolute count, 8 points per security finding (13 findings = 0).
    security:
      label: Security
      subtitle: Vulnerabilities
      normalize: absolute
      floor: 0
      mult: 8.0
      categories:
        - security
        - xss
        - injection
        - csrf
        - cryptography
        - authentication
        - access_control
        - session_management
        - input_validation
        - information_disclosure
        - file_handling
      rule_ids:
        - 'ac-http-005-*'           # SSL verification disabled (category http)

    performance:
      label: Performance
      subtitle: Speed/Load
      normalize: share_of_total
      floor: 15
      mult: 2.5
      categories:
        - performance
        - caching
        - memory
        - loops
        - indexing
        - io_operations
        - algorithms
        - async
        - cron
        - http
        - database

    maintainability:
      label: Maintainability
      subtitle: Tech Debt
      normalize: share_of_total
      floor: 25
      mult: 2.0
      categories:
        - maintainability
        - complexity
        - documentation
        - architecture
        - dependency_injection
        - di
        - object_manager
        - plugins
        - observers
        - module_structure
        - schema
        - php_best_practices
        - style
        - testing
        - configuration
        - layout_xml
        - templates

    # Upgrade compliance: deprecated API usage. Deprecation rules are tagged
    # `logic` by their analyzer, so they are mapped here by rule id.
    compliance:
      label: Compliance
      subtitle: Deprecations
      normalize: share_of_total
      floor: 0
      mult: 5.0
      categories:
        - deprecation
        - deprecated
        - cloud
      rule_ids:
        - 'magento-upgrade-deprecated-*'
        - 'magento-deprecated-pattern'

    api_quality:
      label: API Quality
      subtitle: Interfaces
      normalize: share_of_total
      floor: 20
      mult: 3.0
      categories:
        - api
        - api-quality
        - api_usage
        - graphql

    # Code quality: logic findings plus half of ALL warnings (legacy formula).
    code_quality:
      label: Code Quality
      subtitle: Logic/Style
      normalize: share_of_total
      floor: 20
      mult: 1.5
      categories:
        - logic
        - quality
        - syntax
        - guidance
        - data_handling
        - javascript
        - css
        - frontend
        - responsive
      severities:
        warning: 0.5

  # ---------------------------------------------------------------------------
  # readiness  (HTML pill, CI/CD gate card, Excel "Release Readiness" text,
  #             JSON scores.readiness, JUnit "release_readiness" test case)
  #
  # Rules are checked top to bottom; the FIRST rule that matches wins.
  #   when_any: { ... }   matches if ANY condition is true   (OR)
  #   when_all: { ... }   matches if ALL conditions are true (AND)
  #   If a rule has both, both must match.
  #   A rule with no conditions always matches: keep it LAST as the fallback.
  #
  # Keys per rule:
  #   verdict     text shown in the pill (any text; words BLOCK / RISK / WARN /
  #               REVIEW pick the red / amber colour, anything else is green)
  #   gate        FAIL | WARN | PASS  (CI card; JUnit fails only on FAIL)
  #   summary     text after the gate on the CI card
  #   excel_text  Excel "Release Readiness" text. {input} placeholders are
  #               replaced with the value, e.g. {blocker}, {critical}, {overall}.
  #               If a RISKY-type rule matched on a condition other than
  #               critical, the matched reason is shown instead.
  #
  # The matched conditions are shown as "Why: ..." under the pill.
  # Example stricter project rule:
  #   - { verdict: RISKY, gate: WARN, when_any: { critical: "> 0", error: "> 50", overall: "< 75" } }
  # ---------------------------------------------------------------------------
  readiness:
    - verdict: BLOCKED
      gate: FAIL
      summary: "Block merge and notify team lead"
      excel_text: "BLOCKED — {blocker} blocker(s) must be resolved before deployment"
      when_any:
        blocker: "> 0"
    - verdict: RISKY
      gate: WARN
      summary: "Proceed with mandatory review gate"
      excel_text: "REVIEW REQUIRED — {critical} critical issue(s) should be reviewed before release"
      when_any:
        critical: "> 0"
        overall: "< 65"
    - verdict: READY TO SHIP
      gate: PASS
      summary: "Safe to merge and deploy"
      excel_text: "READY — No blockers detected; standard release process applies"

  # ---------------------------------------------------------------------------
  # grades  (audit grade + console label, JSON `grade`)
  # Checked top to bottom: the first band with score >= min wins.
  # Keep the list sorted from highest to lowest `min`, and end with min: 0.
  # ---------------------------------------------------------------------------
  grades:
    - { min: 95, grade: "A+", label: "Excellent" }
    - { min: 85, grade: "A",  label: "Excellent" }
    - { min: 75, grade: "B",  label: "Good" }
    - { min: 65, grade: "C",  label: "Fair" }
    - { min: 50, grade: "D",  label: "Poor" }
    - { min: 0,  grade: "F",  label: "Needs Improvement" }

  # ---------------------------------------------------------------------------
  # audit  (`acqc audit` score; does NOT change the audit pass/fail gate,
  #         which is still driven by the profile `fail_on` / --fail-on)
  #
  #   score = 100 - SUM( min(cap, normalized(count) x mult) ) per severity
  #   then clamped to [floor, 100], caps applied, rounded to a whole number.
  #
  # normalize:  per_file (default: issues per analysed file), or any mode from
  #             `overall`. `per` is used only by `absolute`.
  # weights:    per severity, either a number (mult only) or { mult, cap }
  #             where cap = most points this severity can take off.
  #             Severities not listed take no points off (use caps for them).
  # caps:       same format as overall.caps. Defaults: any blocker -> max 40 (F),
  #             any critical -> max 60 (D).
  # empty_scope_score: score when nothing was analysed (0 files, 0 issues),
  #             e.g. a pre-commit run with no staged PHP files.
  # ---------------------------------------------------------------------------
  audit:
    # Severity mapping used only for the audit SCORE. Many YAML rules use the
    # high / medium / low scale, which sits below `critical`. Without this map
    # `high` would be read as critical (capped at 60 by the caps below) and
    # medium/low would be ignored. Does not change the audit gate (`fail_on`).
    severity_aliases:
      high: error
      medium: warning
      low: info
    overall:
      normalize: per_file
      floor: 0
      weights:
        error:
          mult: 10.0          # -10 points per error per file ...
          cap: 50.0           # ... at most -50
        warning:
          mult: 5.0           # -5 points per warning per file ...
          cap: 30.0           # ... at most -30
      caps:
        - when:
            blocker: ">= 1"
          max_score: 40
        - when:
            critical: ">= 1"
          max_score: 60
      empty_scope_score: 100

  # ---------------------------------------------------------------------------
  # debt  (technical debt hours: HTML, Excel, JSON `scores.debt_hours`)
  #
  #   raw hours = SUM( findings of severity x hours[severity] )
  #
  # hours:    estimated fix time per finding, in hours.
  # scaling:  how the batch-fix discount is applied with `tiers`
  #   whole_total  (default, legacy) the highest tier whose `above` is below
  #                the raw total multiplies the WHOLE total. Not monotonic:
  #                e.g. raw 5,013 h -> 501 h, but raw 4,999 h -> 1,500 h.
  #   marginal     tax-bracket style: only the hours above each threshold get
  #                that tier's factor. Always grows when findings grow.
  # tiers:    list of { above: <hours>, factor: <multiplier> }.
  # apply_category_weights: true = use weighted counts (seo/a11y at 0.25),
  #           false = every finding counts fully (default).
  # ---------------------------------------------------------------------------
  debt:
    hours:
      blocker: 8.0
      critical: 2.0
      error: 1.0
      warning: 0.5
      info: 0.17
      minor: 0.083
    scaling: whole_total
    tiers:
      - { above: 5000, factor: 0.10 }
      - { above: 2000, factor: 0.30 }
      - { above: 1000, factor: 0.50 }
    apply_category_weights: false

  # ---------------------------------------------------------------------------
  # gates  (extra JUnit / CI quality gates)
  # Each gate becomes a JUnit test case that FAILS when its condition matches.
  #   - { name: <test name>, when: { <conditions> }, mode: any|all }
  #   mode: any (default) = fail if any condition is true; all = only if all are.
  # The `release_readiness` gate (from `readiness`) is always added.
  # `report --quality-gates=<file.json>` gates ("<input> <op> <number>") may use
  # every input listed at the top of this file plus the older names
  # critical_violations, quality_score, technical_debt_hours, test_coverage (0-1)
  # and average_complexity. An unknown input stops the report (no silent pass).
  # Example: - { name: max_errors, when: { error: "> 50" } }
  # ---------------------------------------------------------------------------
  gates: []

  # ---------------------------------------------------------------------------
  # assessment  (Excel Executive Summary "Overall Assessment" and
  #              "Business Impact")
  # Checked top to bottom: the first band with Overall >= min wins. Keep it
  # sorted from highest to lowest `min`, ending with min: 0.
  #   label   first word, shown as "<label> (<score>/100)"
  #   detail  sentence after the label
  #   impact  "Business Impact" text
  # Notes are added automatically after the text: blockers, critical issues,
  # security findings, and debt above 200 h / 500 h.
  # ---------------------------------------------------------------------------
  assessment:
    - min: 90
      label: Excellent
      detail: "High quality standards with minimal issues. Continue current practices."
      impact: "Low risk - Minimal business impact, high maintainability"
    - min: 75
      label: Good
      detail: "Codebase is well-structured with manageable issues. Maintain momentum with targeted fixes."
      impact: "Moderate risk - Some technical debt, manageable impact"
    - min: 60
      label: Fair
      detail: "Codebase is functional but has notable technical debt. Improvement plan recommended."
      impact: "High risk - Significant technical debt, potential performance issues"
    - min: 40
      label: Poor
      detail: "Substantial issues across multiple areas. Significant rework recommended before next release."
      impact: "Critical risk - Major technical debt, security vulnerabilities, high maintenance costs"
    - min: 0
      label: Critical Risk
      detail: "Major quality issues detected; significant remediation required before any production deployment."
      impact: "Critical risk - Major technical debt, security vulnerabilities, high maintenance costs"

  # ---------------------------------------------------------------------------
  # kpis  (Excel Executive Summary "KPI scorecard"; one row per KPI, in order)
  #
  # A KPI is either:
  #   source:  <input>             value = that input (e.g. overall), clamped 0-100
  # or a formula:
  #   base:      start value
  #   direction: deduct      value = base - SUM(terms)   (higher is better)
  #              accumulate  value = base + SUM(terms)   (higher is worse, "risk")
  #   terms:     list, each one of:
  #     { input: <input>, mult: N, cap: N, round_input: D, cast_int: true }
  #         term = input x mult; round_input rounds the input to D decimals
  #         first; cast_int truncates the term to a whole number; cap limits it.
  #     { when: { <conditions> }, add: N }
  #         adds N when ANY condition is true.
  #   The result is clamped to 0-100.
  #
  # Status (Excel "Pass" / "Warn" / "Fail"):
  #   pass: "<op> <number>"  checked first -> Pass
  #   warn: "<op> <number>"  checked next  -> Warn
  #   otherwise                            -> Fail
  #   For "risk" KPIs use "<=" (lower is better); for scores use ">=".
  #
  # Display: label, note (last column), unit (text after the value),
  #          format: int (default) | float1 (one decimal).
  # Inputs ending in _pct are percentages of all findings (weighted counts).
  # ---------------------------------------------------------------------------
  kpis:
    release_readiness:
      label: "Release Readiness Score"
      note: "Deployment gate: blockers, criticals, security, debt weighted"
      unit: "/100"
      base: 100
      direction: deduct
      terms:
        - { input: blocker, mult: 25.0, cap: 50.0 }               # any blocker is severe
        - { input: critical_pct, mult: 2.5, cap: 25.0 }           # critical density
        - { input: security_pct, mult: 3.0, cap: 15.0 }           # security density
        - { when: { debt_hours: "> 200" }, add: 10.0 }            # debt penalty
      pass: ">= 80"
      warn: ">= 60"

    business_risk:
      label: "Business Risk Score"
      note: "Higher = more business risk; target ≤20"
      unit: "/100 risk"
      base: 0
      direction: accumulate
      terms:
        - { input: blocker, mult: 25.0, cap: 50.0 }
        - { input: critical_pct, mult: 2.5, cap: 25.0 }
        - { input: security_pct, mult: 3.0, cap: 15.0 }
        - { when: { debt_hours: "> 200" }, add: 10.0 }
        - { when: { debt_hours: "> 500" }, add: 10.0 }
      pass: "<= 20"
      warn: "<= 50"

    quality_confidence:
      label: "Quality Confidence Score"
      note: "Composite weighted analyzer score; target ≥80"
      unit: "/100"
      source: overall                                             # = Overall score
      pass: ">= 80"
      warn: ">= 65"

    security_health:
      label: "Security Health Score"
      note: "Target ≥90; deducted per security violation"
      unit: "/100"
      base: 100
      direction: deduct
      terms:
        - { input: security, mult: 12.0 }                         # -12 per security finding
        - { when: { blocker: "> 0" }, add: 10.0 }
      pass: ">= 90"
      warn: ">= 70"

    maintainability_index:
      label: "Maintainability Index"
      note: "Industry scale 0–100; target ≥70"
      unit: ""
      format: float1
      source: maintainability_index                               # from module metrics
      pass: ">= 70"
      warn: ">= 50"

    performance_stability:
      label: "Performance Stability Score"
      note: "Based on performance violation density; target ≥80"
      unit: "/100"
      base: 100
      direction: deduct
      terms:
        - { input: performance_pct, round_input: 1, mult: 3.0, cast_int: true }
      pass: ">= 80"
      warn: ">= 60"

    criticality:
      label: "Criticality Score"
      note: "Weighted blocker/critical density; target ≤5"
      unit: "/100 risk"
      base: 0
      direction: accumulate
      terms:
        - { input: blocker_pct, mult: 4.0 }
        - { input: critical_pct, mult: 2.0 }
        - { input: error_pct, mult: 1.0 }
      pass: "<= 5"
      warn: "<= 20"

    upgrade_readiness:
      label: "Upgrade Readiness Score"
      note: "Deprecation + critical penalty; target ≥80 for major upgrades"
      unit: "/100"
      base: 100
      direction: deduct
      terms:
        - { input: deprecation_pct, round_input: 1, mult: 5.0, cast_int: true }
        - { when: { critical: "> 0" }, add: 10.0 }
      pass: ">= 80"
      warn: ">= 60"

    customer_impact_risk:
      label: "Customer Impact Risk Score"
      note: "Security + blocker + frontend risk; target ≤15"
      unit: "/100 risk"
      base: 0
      direction: accumulate
      terms:
        - { input: security, mult: 10.0 }
        - { input: blocker, mult: 15.0 }
        - { input: critical, mult: 3.0 }
        - { input: frontend_pct, mult: 0.3, cast_int: true }
      pass: "<= 15"
      warn: "<= 40"

  # ---------------------------------------------------------------------------
  # status  (Excel detail sheets: status / impact cells)
  #
  # A band is { good: "<op> <number>", warn: "<op> <number>" }:
  #   good matches -> "Good" (impact Low), else warn matches -> "Warning"
  #   (impact Medium), else -> "Critical" (impact High).
  # ---------------------------------------------------------------------------
  status:
    # "Security" sheet.
    security_sheet:
      # Security Score = 100 - SUM(count x points) over security findings.
      weights:
        blocker: 30
        critical: 20
        error: 10
        warning: 5
        info: 1
      score: { good: ">= 85", warn: ">= 70" }       # Security Score status
      owasp: { good: ">= 90", warn: ">= 75" }       # OWASP Compliance status
      # Allowed count per severity row. Status: <= limit Good,
      # <= limit x 1.5 Warning, above Critical. `critical` row includes blockers.
      row_thresholds:
        critical: 0
        error: 5
        warning: 10
        info: 20

    # "Performance" sheet.
    performance_sheet:
      # Total performance findings. Extra `info` band:
      # good -> Good, info -> Warning, warn -> Error, else Critical.
      total_violations: { good: "== 0", info: "<= 3", warn: "<= 10" }
      critical_issues: { good: "== 0" }              # blocker + critical findings
      high_issues: { good: "<= 5", warn: "<= 15" }   # error / high findings
      files_affected: { good: "<= 20", warn: "<= 50" }

    # "Code Quality" sheet.
    code_quality_sheet:
      complexity: { good: "<= 5.0", warn: "<= 7.0" }          # average cyclomatic complexity
      maintainability: { good: ">= 70.0", warn: ">= 50.0" }   # maintainability index
      debt_ratio: { good: "<= 0.020", warn: "<= 0.050" }      # technical debt ratio
      debt_hours: { good: "<= 200", warn: "<= 500" }          # technical debt hours
      coverage: { good: ">= 0.80", warn: ">= 0.60" }          # line coverage, 0-1
      documentation: { good: ">= 70.0", warn: ">= 50.0" }    # documentation coverage %
      standards: { good: ">= 90.0", warn: ">= 75.0" }        # standards compliance %

    # "Module Analysis" sheet: estimated fix hours per finding, by severity.
    module_sheet:
      debt_hours:
        blocker: 8.0
        critical: 4.0
        error: 2.0
        warning: 1.0
        info: 0.5
        minor: 0.25

  # ---------------------------------------------------------------------------
  # placeholders  (Excel cells when a metric was not measured, e.g. complexity,
  #                documentation coverage, standards compliance)
  #   show_na  show "N/A" (default)
  #   legacy   show the old hard-coded sample values (5.2, 65, 45 %, 78 %)
  # ---------------------------------------------------------------------------
  placeholders: show_na
